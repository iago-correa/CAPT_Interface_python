{% extends 'login/base.html' %}
{% load static %}
{% load audio_filters %}
{% block content %}
<div class="container mt-4">

    <div class="position-relative">
        <h1>発音練習デモ</h1>
        <a class="btn btn-danger position-absolute top-0 end-0" href="{% url 'kengaku:reset'%}" role="button">Reset</a>
    </div>
    
    {% csrf_token %}
    {% for file_id, text in audio_data %}

        <div class="audio-block card mb-3" data-audio-id="{{file_id}}">
            <div class="card-body">

                <p class="mb-1">{{ text }}</p>

                    {% if not forloop.first %}

                        <div class="mb-3">
                            <div class="row g-2 align-items-center">

                                <div class="col">
                                    <div class="d-grid">
                                        <p class="mb-1 text-center">ネイティブ<br>音声</p>
                                    </div>
                                </div>

                                <div class="col-9">
                                    <div class="d-flex align-items-center gap-2">
                                        <audio id="audio_player_{{file_id}}" controls class="w-100">
                                            {% if not initial_rec %} <source src="/static/audio/native/{{file_id}}.mp3" type="audio/wav"> {% endif %}
                                        </audio>
                                    </div>
                                </div>

                            </div>
                        </div>

                    {% endif %}

                    <div class="mb-3">
                        <div class="row g-2 align-items-center">

                            <div class="col">
                                <div class="d-grid">
                                    <p class="mb-1 text-center">生成音声</p>
                                </div>
                            </div>

                            <div class="col-9">
                                <div class="d-flex align-items-center gap-2">
                                    <audio id="audio_player_{{file_id}}" controls class="w-100">
                                        <source src="/media/gs/{{user_id}}/{{file_id}}.wav" type="audio/wav">
                                    </audio>
                                </div>
                            </div>

                        </div>
                    </div>

                <div class="row g-2 align-items-center">

                    <div class="col-auto">
                        <div class="d-grid">
                            <button class="recordBtn btn btn-primary py-2" 
                                    data-audio-id-rec="rec_{{file_id}}"
                                    {% if not forloop.first and initial_rec%} disabled {% endif %}>
                                録音開始
                            </button>
                        </div>
                    </div>

                    <div class="col">
                        <div class="d-flex align-items-center gap-2">
                            <audio id="recording_player_{{file_id}}" controls class="w-100">
                                <source src="/media/recording/{{user_id}}/{{file_id}}_recording.wav" type="audio/wav">
                            </audio>
                        </div>
                    </div>

                </div> 

            </div>
        </div>

    {% endfor %}

</div>

<script src="{% static 'js/recorder.js' %}"></script>
<script>
    
    const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
    let recorder, gumStream, audioContext;

    function lockAllButtons(except = null) {
        document.querySelectorAll('.recordBtn').forEach(btn => {
            if (btn !== except) btn.disabled = true;
        });
    }

    function restoreAllButtons(except = null) {
        document.querySelectorAll('.recordBtn').forEach(btn => {
            if (btn !== except) btn.disabled = false;
        });
    }

    document.querySelectorAll('.audio-block').forEach(block => {
        const audioId = block.dataset.audioId;
        const userId = "{{ user_id }}";
        const initialRec = "{{ initial_rec }}";
        const recBtn = block.querySelector('.recordBtn');

        recBtn.onclick = async () => {
            if (recBtn.dataset.state !== 'recording') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new AudioContext();
                    gumStream = stream;
                    const input = audioContext.createMediaStreamSource(stream);
                    recorder = new Recorder(input, { numChannels: 1 });
                    recorder.record();

                    lockAllButtons(recBtn);
                    recBtn.textContent = '録音停止';
                    recBtn.dataset.state = 'recording';
                } catch (err) {
                    alert("マイクにアクセスできませんでした。");
                    console.error(err);
                }
            } else {
                recorder.stop();
                gumStream.getAudioTracks()[0].stop();
                recBtn.textContent = '処理中.';
                recBtn.disabled = true;

                recorder.exportWAV(async blob => {
                    const formData = new FormData();
                    formData.append('audio', blob, `train_rec_${audioId}.wav`);
                    formData.append('reference_audio', audioId);
                    formData.append('user_id', userId);
                    formData.append('initial_rec', initialRec);

                    try {
                        const res = await fetch('/demo/', {
                            method: 'POST',
                            headers: { 'X-CSRFToken': csrfToken },
                            body: formData
                        });
                        const data = await res.json();
                        if (res.ok && data.status === 'success') {
                            if (initialRec === 'True') {
                                location.reload();
                            } else {
                                const player = document.getElementById(`recording_player_${audioId}`);
                                const timestamp = new Date().getTime();
                                player.src = `/media/${data.recording.url}?t=${timestamp}`;
                                player.load();
                            }
                            restoreAllButtons();
                        } else {
                            alert("録音の保存に失敗しました。");
                        }
                    } catch (err) {
                        alert("エラーが発生しました。\n明細：" + err.message);
                        console.error(err);
                    }

                    recBtn.textContent = '録音開始';
                    recBtn.dataset.state = 'idle';
                    recBtn.disabled = false;
                });
            }
        };
        
    }); 

</script>

{% endblock %}
